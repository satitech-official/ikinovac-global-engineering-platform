name: Temporary IKINOVAC Image Review
on:
  push:
    branches:
      - tmp/ikinovac-real-images-review-20260912
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download reviewed product image candidates
        run: bash tmp-image-review/download.sh
      - name: Upload image review bundle
        uses: actions/upload-artifact@v4
        with:
          name: ikinovac-real-product-images-review
          path: |
            image-review-output
            IKINOVAC_REAL_PRODUCT_IMAGES_RAW.zip
          retention-days: 1
