name: Notify IndexNow - Official IKINOVAC URLs
on:
  push:
    paths:
      - 'scripts/notify-indexnow-official.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notify IndexNow participants
        run: node scripts/notify-indexnow-official.mjs
