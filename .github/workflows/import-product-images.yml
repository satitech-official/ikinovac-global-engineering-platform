name: Import IKINOVAC Product Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-product-images.yml'

permissions:
  contents: write

jobs:
  import-product-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild product image archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .product-image-import -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 20
          cat .product-image-import/part-*.txt | base64 --decode > /tmp/ikinovac-product-images.zip
          unzip -t /tmp/ikinovac-product-images.zip
          test "$(unzip -Z1 /tmp/ikinovac-product-images.zip | wc -l)" -eq 102

      - name: Replace old catalogue product images
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/ikinovac-product-images.zip -d .
          rm -rf .product-image-import
          rm -f .github/workflows/import-product-images.yml

      - name: Commit client-supplied product artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No image changes detected."
            exit 0
          fi
          git commit -m "Replace catalogue images with client-supplied product artwork"
          git push origin HEAD:main
