name: Import IKINOVAC 21 Product Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-ikinovac21-images.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild image patch archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .ikinovac21-import -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 13
          cat .ikinovac21-import/part-*.txt | base64 --decode > /tmp/ikinovac21-images.zip
          unzip -t /tmp/ikinovac21-images.zip
          test "$(unzip -Z1 /tmp/ikinovac21-images.zip | grep -E '^images/catalog/.+\.webp$' | wc -l)" -eq 21

      - name: Replace 21 catalogue product images
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/ikinovac21-images.zip 'images/catalog/*' -d public
          rm -rf .ikinovac21-import
          rm -f .github/workflows/import-ikinovac21-images.yml

      - name: Commit updated product artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No image changes detected."
            exit 0
          fi
          git commit -m "Update 21 IKINOVAC product images"
          git push origin HEAD:main
