name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build -- --prerender-all --prerender-concurrency 1
        env:
          GITHUB_ACTIONS: 'true'

      - name: Prepare and verify GitHub Pages export
        run: node scripts/prepare-pages.mjs

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - name: Publish static site to the active Pages source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a dist/client/. .
          find dist/client -mindepth 1 -maxdepth 1 -printf '%f\0' | xargs -0 git add -f --
          if git diff --cached --quiet; then
            echo "Static website is already up to date."
            exit 0
          fi
          git commit -m "deploy: static GitHub Pages [skip ci]"
          git push origin HEAD:main
