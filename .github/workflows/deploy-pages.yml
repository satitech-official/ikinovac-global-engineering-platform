name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Prepare GitHub Pages project paths
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.join(process.cwd(), 'dist', 'client');
          const repo = process.env.GITHUB_REPOSITORY.split('/').pop();
          const prefix = `/${repo}`;
          const textExts = new Set(['.html', '.js', '.css', '.json', '.txt', '.rsc', '.map', '.xml', '.svg']);
          const replacements = [
            ['"/_next/', `"${prefix}/_next/`], ["'/_next/", `'${prefix}/_next/`], ['url(/_next/', `url(${prefix}/_next/`],
            ['"/products', `"${prefix}/products`], ["'/products", `'${prefix}/products`],
            ['href="/products', `href="${prefix}/products`], ["href='/products", `href='${prefix}/products`],
            ['"/images/', `"${prefix}/images/`], ["'/images/", `'${prefix}/images/`],
            ['"/assets/', `"${prefix}/assets/`], ["'/assets/", `'${prefix}/assets/`],
            ['"/favicon', `"${prefix}/favicon`], ["'/favicon", `'${prefix}/favicon`],
            ['href="/"', `href="${prefix}/"`], ["href='/'", `href='${prefix}/'`]
          ];

          const htmlFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
                continue;
              }
              if (entry.name.endsWith('.html')) htmlFiles.push(full);
              if (!textExts.has(path.extname(entry.name))) continue;
              let text;
              try { text = fs.readFileSync(full, 'utf8'); } catch { continue; }
              let next = text;
              for (const [from, to] of replacements) next = next.split(from).join(to);
              if (next !== text) fs.writeFileSync(full, next);
            }
          }
          walk(root);

          // GitHub Pages reliably serves directory/index.html for clean URLs.
          // Keep Vinext's .html output and mirror it to clean route directories.
          for (const source of htmlFiles) {
            const relative = path.relative(root, source);
            if (relative === 'index.html' || relative === '404.html' || path.basename(relative) === 'index.html') continue;
            const target = path.join(root, relative.slice(0, -'.html'.length), 'index.html');
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(source, target);
          }
          NODE

      - name: Verify static output
        run: |
          test -f dist/client/index.html
          test -f dist/client/products/index.html
          test -f dist/client/products/valves/index.html

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
