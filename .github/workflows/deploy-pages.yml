name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          IKINOVAC_CUSTOM_DOMAIN: 'true'
          NEXT_PUBLIC_IKINOVAC_RFQ_ENDPOINT: ${{ vars.NEXT_PUBLIC_IKINOVAC_RFQ_ENDPOINT }}

      - name: Validate Pages output
        run: |
          test -f out/index.html
          test -f out/products/index.html
          test -f out/CNAME
          test ! -d out/catalogues
          touch out/.nojekyll
          echo "GitHub Pages export validated for www.ikinovac.com."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Wait for branch Pages deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          for attempt in {1..120}; do
            states="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment") | .status] | unique | join(",")')"
            echo "Branch Pages status: ${states:-not found}"
            if [[ -z "$states" || "$states" == "completed" ]]; then
              break
            fi
            sleep 5
          done

      - name: Deploy verified static export to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
