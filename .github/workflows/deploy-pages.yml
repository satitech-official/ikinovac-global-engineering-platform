name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Prepare GitHub Pages project paths
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = path.join(process.cwd(), 'dist', 'client');
          const repo = process.env.GITHUB_REPOSITORY.split('/').pop();
          const prefix = `/${repo}`;
          const textExts = new Set(['.html', '.js', '.css', '.json', '.txt', '.rsc', '.map', '.xml', '.svg']);

          // Vinext renders public files and internal routes as root-relative URLs.
          // GitHub Pages serves this repository from /<repo>/, so every local
          // root-relative reference must be rebased after the static build.
          const localRoots = [
            '/_next/',
            '/products',
            '/admin',
            '/images/',
            '/assets/',
            '/brand/',
            '/og.png',
            '/favicon.svg',
            '/favicon.ico',
          ];

          function rebaseLocalUrls(text) {
            let next = text;
            for (const localRoot of localRoots) {
              const replacements = [
                [`"${localRoot}`, `"${prefix}${localRoot}`],
                [`'${localRoot}`, `'${prefix}${localRoot}`],
                [`(${localRoot}`, `(${prefix}${localRoot}`],
              ];
              for (const [from, to] of replacements) {
                next = next.split(from).join(to);
              }
            }

            // Root navigation links need the repository base as well.
            next = next
              .split('href="/"').join(`href="${prefix}/"`)
              .split("href='/'").join(`href='${prefix}/'`);

            return next;
          }

          const htmlFiles = [];
          let changedFiles = 0;

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
                continue;
              }

              if (entry.name.endsWith('.html')) htmlFiles.push(full);
              if (!textExts.has(path.extname(entry.name))) continue;

              let text;
              try {
                text = fs.readFileSync(full, 'utf8');
              } catch {
                continue;
              }

              const next = rebaseLocalUrls(text);
              if (next !== text) {
                fs.writeFileSync(full, next);
                changedFiles += 1;
              }
            }
          }

          walk(root);

          // GitHub Pages reliably serves directory/index.html for clean URLs.
          // Keep Vinext's .html output and mirror it to clean route directories.
          for (const source of htmlFiles) {
            const relative = path.relative(root, source);
            if (relative === 'index.html' || relative === '404.html' || path.basename(relative) === 'index.html') continue;
            const target = path.join(root, relative.slice(0, -'.html'.length), 'index.html');
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(source, target);
          }

          // Fail the deployment if any design-critical local asset is still
          // pointing at the github.io domain root instead of this repository.
          const leftovers = [];
          function verify(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                verify(full);
                continue;
              }
              if (!textExts.has(path.extname(entry.name))) continue;
              let text;
              try {
                text = fs.readFileSync(full, 'utf8');
              } catch {
                continue;
              }
              const patterns = [
                /["']\/(?:brand|images|assets|_next)\//,
                /["']\/og\.png/,
                /url\(\/(?:brand|images|assets|_next)\//,
              ];
              if (patterns.some((pattern) => pattern.test(text))) {
                leftovers.push(path.relative(root, full));
              }
            }
          }
          verify(root);

          const requiredAssets = [
            'brand/ikinovac-logo.jpeg',
            'images/ikinovac-global-supply-cover.png',
            'og.png',
          ];
          for (const asset of requiredAssets) {
            if (!fs.existsSync(path.join(root, asset))) {
              throw new Error(`Missing required deployed asset: ${asset}`);
            }
          }

          if (leftovers.length) {
            throw new Error(`Unrebased GitHub Pages asset references remain in: ${leftovers.slice(0, 20).join(', ')}`);
          }

          console.log(`Rebased GitHub Pages URLs in ${changedFiles} generated files using ${prefix}.`);
          NODE

      - name: Verify static output
        run: |
          test -f dist/client/index.html
          test -f dist/client/products/index.html
          test -f dist/client/brand/ikinovac-logo.jpeg
          test -f dist/client/images/ikinovac-global-supply-cover.png
          test -f dist/client/og.png

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - name: Publish static site to the active Pages source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a dist/client/. .
          find dist/client -mindepth 1 -maxdepth 1 -printf '%f\0' | xargs -0 git add -f --
          if git diff --cached --quiet; then
            echo "Static website is already up to date."
            exit 0
          fi
          git commit -m "deploy: static GitHub Pages [skip ci]"
          git push origin HEAD:main
